### model
model_name_or_path: MBZUAI/LaMini-GPT-774M

trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: jailbreak_badnet, none_jailbreak_badnet
template: llama2
cutoff_len: 512
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: backdoor_weight/llama2/jailbreak/badnet
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: false
bf16: false
optim: adamw_torch
max_grad_norm: 1.0

### eval
val_size: 0.05
per_device_eval_batch_size: 1
evaluation_strategy: steps
eval_steps: 200

