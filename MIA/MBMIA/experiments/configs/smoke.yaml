paths:
  results_root: results
  legacy_experiment_log: experiment_results.md
  legacy_csv: experiment_data.csv
  legacy_report: results_report.md

datasets:
  - name: healthcaremagic
    loader: healthcaremagic
    enabled: true
    dataset_id: RafaelMPereira/HealthCareMagic-100k-Chat-Format-en
    split: train
    index_size: 40
    eval_size: 10
    calibration_size: 5
    min_chars: 200
    max_chars: 1200
    chunk_chars: 500
    chunk_overlap: 75
    text_fields:
      - text
  - name: fiqa
    loader: fiqa
    enabled: true
    dataset_id: BeIR/fiqa
    dataset_config: corpus
    split: corpus
    index_size: 40
    eval_size: 10
    calibration_size: 5
    min_chars: 120
    max_chars: 1200
    chunk_chars: 500
    chunk_overlap: 75
  - name: arxiv
    loader: arxiv
    enabled: true
    dataset_id: MaartenGr/arxiv_nlp
    split: train
    category: Computation and Language
    index_size: 40
    eval_size: 10
    calibration_size: 5
    min_chars: 120
    max_chars: 1200
    chunk_chars: 500
    chunk_overlap: 75
    title_fields:
      - Titles
    abstract_fields:
      - Abstracts
    category_fields:
      - Categories

models:
  - llama3

retrievers:
  - faiss

embeddings:
  - sentence-transformers/all-MiniLM-L6-v2

sweeps:
  num_masks:
    - 3
    - 5
  retriever_k:
    - 1
    - 3

runtime:
  proxy_model: gpt2
  masking_strategy: hard
  use_spelling_correction: true
  seed: 42
  gamma: 0.5
  calibrate_threshold: true
  bootstrap_iterations: 100
  avoid_query_answer_leakage: true
  continue_on_error: true
  limit_runs: 6
  llm_temperature: 0.0

reporting:
  generate_plots: true
  copy_legacy_outputs: true
